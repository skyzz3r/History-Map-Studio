name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built by the "Build history tiles" workflow and force-pushed to an
      # orphan `tiles` branch, so it never bloats main's history. Absent on a
      # fresh clone or before the first tile build — the app detects that at
      # runtime and falls back to OHM's hosted tiles, so this must not fail.
      - name: Fetch prebuilt history tiles (optional)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: tiles
          path: .tiles

      - name: Stage tiles into public/
        run: |
          if compgen -G ".tiles/*.pmtiles" > /dev/null; then
            mkdir -p public/basemaps && cp .tiles/*.pmtiles public/basemaps/
            ls -lh public/basemaps/
          else
            echo "no prebuilt tiles; app will use OHM's hosted tiles"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      # VITE_OHM_R2_URL points the app at an off-Pages PMTiles archive (higher
      # maxzoom than the 100 MB Pages cap allows). Set repo variable OHM_R2_URL
      # to enable it; empty = the app uses the bundled z6 file, then hosted
      # tiles. See docs/R2-SETUP.md.
      - run: npm run build # tsc --noEmit && vite build
        env:
          VITE_OHM_R2_URL: ${{ vars.OHM_R2_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
